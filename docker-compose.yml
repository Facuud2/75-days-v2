version: '3.8'

services:
  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true

  backend-core:
    image: node:22
    working_dir: /app
    volumes:
      - ./apps/backend-core:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development

  backend-health:
    image: node:22
    working_dir: /app
    volumes:
      - ./apps/backend-health:/app
      - /app/node_modules
    ports:
      - "3002:3002"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
